# Every test stands alone (TestDataFolder): the classes and the tests of each run in an order of chance, its seed in the
# log, so that a test leaning on what another left fails rather than passes by the order it happened to be run in.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random

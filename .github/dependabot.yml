version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /browser-extension
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # From v6 its cache is a proprietary component under the Gradle Terms of Use, not accepted here (2026-11-07):
      # setup-gradle stays on v5, MIT-licensed with its cache
      - dependency-name: gradle/actions*
        update-types: ["version-update:semver-major"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build distZip --console=plain

      - name: Lint the Firefox extension
        working-directory: browser-extension
        run: |
          npm ci --no-audit --no-fund
          npm run lint

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - uses: actions/upload-artifact@v7
        with:
          name: recommend4me
          path: |
            app/build/distributions/recommend4me-*.zip
            app/build/extension/recommend4me-firefox.zip
